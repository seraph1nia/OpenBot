name: ${COMPOSE_PROJECT_NAME:-openbot-local}

x-server-image: &server-image
  image: openbot-local-server:bd4dc949
  build:
    context: .
    dockerfile: server/Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/local/init.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U openbot -d openbot']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *server-image
    command: [bun, scripts/migrate.ts]
    environment:
      DATABASE_URL: postgres://openbot:${POSTGRES_PASSWORD}@postgres:5432/openbot
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  server:
    <<: *server-image
    environment:
      NODE_ENV: production
      PORT: '3001'
      TENANT_PACKAGE_DIR: ../local/tenant
      OPENBOT_SINGLE_USER: 'true'
      OPENBOT_APP_URL: http://localhost:${APP_PORT:-3010}
      OPENBOT_PUBLIC_URL: http://localhost:${APP_PORT:-3010}
      OPENBOT_SUBSCRIPTION_ONLY: 'true'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:?Run python3 scripts/local/init.py}
      DATABASE_URL: postgres://openbot:${POSTGRES_PASSWORD}@postgres:5432/openbot
      INTELLIGENCE_API_URL: ${INTELLIGENCE_CONTAINER_API_URL:-}
      INTELLIGENCE_GATEWAY_WS_URL: ${INTELLIGENCE_CONTAINER_WS_URL:-}
      INTELLIGENCE_CLIENT_GATEWAY_WS_URL: ${INTELLIGENCE_GATEWAY_WS_URL:-}
      INTELLIGENCE_API_KEY: ${INTELLIGENCE_API_KEY:-}
      INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:-}
      INTELLIGENCE_PROJECT_ID: ${INTELLIGENCE_PROJECT_ID:-}
      CPK_INTELLIGENCE_LEARNING_CONTAINER_ID: ${CPK_INTELLIGENCE_LEARNING_CONTAINER_ID:-}
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN}
      PICKED_HARNESS_IMAGE: openbot-local-mastra:1.15.0
      PICKED_HARNESS_URL: http://mastra:4213
      PICKED_HARNESS_KIND: remote-mastra
      PICKED_HARNESS_AGENT_ID: openbot
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET}
      AGENT_COMPUTER_URL: http://agent-computer:4100
      COMPUTER_TOKEN: ${COMPUTER_TOKEN}
      COMPUTER_SUPERVISOR_URL: http://supervisor:4300
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN}
      AGENT_STALL_TIMEOUT_MS: '120000'
      OPENBOT_SELF_HOST_BANNER: 'false'
      COPILOTKIT_TELEMETRY_DISABLED: 'true'
    ports:
      - 127.0.0.1:${APP_PORT:-3010}:3001
    networks: [data, control, computers, intelligence]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mastra:
        condition: service_healthy
      supervisor:
        condition: service_healthy
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://localhost:3001/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    <<: *server-image
    working_dir: /app
    command: [bun, worker/src/index.ts]
    environment:
      DATABASE_URL: postgres://openbot:${POSTGRES_PASSWORD}@postgres:5432/openbot
      SERVER_INTERNAL_URL: http://server:3001
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET}
    networks: [data]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: [CMD, bun, -e, "const t=Number(await Bun.file('/tmp/openbot-worker-heartbeat').text());process.exit(Date.now()-t<300000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  maintenance:
    <<: *server-image
    command: [sh, -c, 'while true; do bun scripts/cull-staged-attachments.ts && date +%s > /tmp/maintenance-heartbeat; sleep 3600; done']
    environment:
      DATABASE_URL: postgres://openbot:${POSTGRES_PASSWORD}@postgres:5432/openbot
    networks: [data]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, bun, -e, "const t=Number(await Bun.file('/tmp/maintenance-heartbeat').text());process.exit(Date.now()/1000-t<7200?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Builds the image the existing supervisor uses for dynamically created per-Bot computers.
  agent-computer:
    profiles: [images]
    image: openbot-local-computer:bd4dc949
    build:
      context: .
      dockerfile: agent-computer/Dockerfile
    environment:
      COMPUTER_TOKEN: ${COMPUTER_TOKEN}
    volumes:
      - agent-workspace:/workspace
      - agent-profiles:/profiles
    networks: [computers]
    restart: unless-stopped

  supervisor:
    image: openbot-local-supervisor:bd4dc949
    build:
      context: .
      dockerfile: supervisor/Dockerfile
    environment:
      PORT: '4300'
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN}
      COMPUTER_TOKEN: ${COMPUTER_TOKEN}
      COMPUTER_IMAGE: openbot-local-computer:bd4dc949
      COMPUTER_NAMESPACE: ${COMPOSE_PROJECT_NAME:-openbot-local}
      COMPUTER_NETWORK: ${COMPOSE_PROJECT_NAME:-openbot-local}_computers
      COMPUTER_BROWSER_MODE: headed
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [computers]
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://localhost:4300/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mastra-init:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    user: '0:0'
    command: [sh, -c, 'chown 1000:1000 /var/lib/mastra && chmod 700 /var/lib/mastra']
    volumes:
      - mastra-auth:/var/lib/mastra
    network_mode: none
    restart: 'no'

  mastra:
    image: openbot-local-mastra:1.15.0
    build:
      context: .
      dockerfile: agent-mastra/Dockerfile
    environment: &mastra-env
      PORT: '4213'
      BOT_PROVIDER: openai-codex
      BOT_MODEL: ${BOT_MODEL:-gpt-5.6-sol}
      MASTRA_APP_DATA_DIR: /var/lib/mastra
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN}
      OPENBOT_TOOL_URL: http://server:3001/api/agent-tools/call
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN}
      MASTRA_TELEMETRY_DISABLED: 'true'
      DO_NOT_TRACK: '1'
      NODE_ENV: production
    volumes:
      - mastra-auth:/var/lib/mastra
    networks: [control]
    depends_on:
      mastra-init:
        condition: service_completed_successfully
    healthcheck:
      # Process liveness deliberately does not require login or spend subscription allowance.
      test: [CMD, node, -e, "fetch('http://localhost:4213/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  mastra-auth:
    profiles: [setup]
    image: openbot-local-mastra:1.15.0
    build:
      context: .
      dockerfile: agent-mastra/Dockerfile
    environment: *mastra-env
    command: [node, --import, tsx, src/auth.ts]
    volumes:
      - mastra-auth:/var/lib/mastra
    networks: [control]
    depends_on:
      mastra-init:
        condition: service_completed_successfully
    restart: 'no'

networks:
  data:
    internal: true
  control:
  computers:
  intelligence:

volumes:
  postgres-data:
  mastra-auth:
  agent-workspace:
  agent-profiles:
